<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Private Chapter</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(circle at top left, #ffffff 0%, #f6f1e8 60%),
    linear-gradient(to bottom, #f6f1e8, #efe6d8);
  font-family:'Cormorant Garamond', serif;
  color:#2c2c2c;
  display:flex;
  align-items:center;
  justify-content:center;
}

.book{
  width:90%;
  max-width:800px;
  height:600px;
  background:#fffdf8;
  padding:40px 50px;
  border-radius:6px;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.08),
    inset 0 0 40px rgba(184,155,94,0.08);
  position:relative;

  display:flex;
  flex-direction:column;
}


.storyMode{
  height:600px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}



h1{
  font-family:'Playfair Display', serif;
  color:#5a1f2c;
  letter-spacing:1px;
  margin-bottom:20px;
}

.subtitle{
  font-style:italic;
  opacity:0.8;
}

input{
  padding:12px;
  margin-top:25px;
  border:1px solid #d8cfc2;
  background:#faf7f1;
  border-radius:4px;
  width:260px;
  font-size:16px;
  text-align:center;
  font-family:'Cormorant Garamond', serif;
}

button{
  margin-top:25px;
  padding:10px 26px;
  background:#5a1f2c;
  color:white;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-size:15px;
  letter-spacing:1px;
  transition:0.3s ease;
}

button:hover{
  background:#7a2a3b;
}

.hidden{
  display:none;
}

.storyText{
  flex:1;
  overflow-y:auto;
  font-size:20px;
  line-height:1.8;
  text-align:justify;

  padding-right:10px;
}

  #bookContent{
  display:flex;
  flex-direction:column;
  height:100%;
}
  
.navButtons{
  margin-top:20px;
}

  .storyText{
  mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
}




@keyframes fade{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

.divider{
  height:1px;
  width:80px;
  background:#b89b5e;
  margin:25px auto;
}
</style>
</head>

<body>

<div class="book">

<div id="firstLock">
  <h1>Our Private Volume</h1>
  <div class="divider"></div>
  <p class="subtitle">What you are about to read is only a fragment of the many beautiful things I dream of with you... </p>
  <input id="pass1" placeholder="Do you remember your safeword?">
  <br>
  <button onclick="unlockOne()">Open the Book</button>
  <p id="err1"></p>
</div>

<div id="disclaimer" class="hidden">
  <h1>Before You Turn The Page</h1>
  <div class="divider"></div>
  <p class="subtitle">
    Dear Isha,
    This project is intimate and contain themes you consider nsfw.
    Please continue only when you are comfortable.
  </p>
  <input id="pass2" placeholder='Type: I am ready'>
  <br>
  <button onclick="unlockTwo()">Proceed</button>
  <p id="err2"></p>
</div>

<div id="bookContent" class="hidden">
  <h1>The Private Chapter</h1>
  <div class="divider"></div>

  <div id="text" class="storyText"></div>

  <div class="navButtons">
    <button onclick="prevPage()" id="prevBtn">Previous</button>
    <button onclick="nextPage()" id="nextBtn">Next</button>
  </div>
</div>


</div>

</div>

<script>
const PASSWORD1 = "pineapple";
const PASSWORD2 = "i am ready";

const pages = [

`<b>Chapter 1: The Moment We Stopped Pretending</b><br><br>

Warm summer afternoons are often very quiet. The light blue cloudy skies, the cool breeze, and the long shadows cast by the swaying trees overhead are a common yet pleasant sight. Everything moves slowly at that hour, as if the world itself has decided to rest for a while.<br><br>

I stood by the square on the footpath, waiting for a certain someone.<br><br>

My heart raced with anticipation and excitement, because this person was the love of my life.<br><br>

Then, across the road, I saw you.<br><br>

You waved towards me.<br><br>

My heart skipped a beat as you began walking towards me, smiling. Your hair was left open, catching the sunlight as it moved gently with the breeze. You wore a blue hoodie that fit your body perfectly, and a pair of leggings that showed off your legs very nicely. You looked like a fit athlete, your body toned and confident in the way you walked.<br><br>

But it wasn’t just how you looked.<br><br>

As you came closer, I caught the scent of your perfume. It reached me before you did — soft, warm, and strangely intoxicating. For a moment it felt as if the scent alone wrapped itself around my thoughts, quietly pulling me closer.<br><br>

We began walking along the empty streets together.<br><br>

Neither of us spoke much. We both desperately wanted to hold hands, but how could we in broad daylight? Every passing vehicle, every distant movement, felt like a reminder that we were being watched by the world.<br><br>

So we walked side by side.<br><br>

Close.<br><br>

Close enough to feel the warmth of each other’s presence, but not quite touching.`,



`Occasionally I shifted slightly towards you, hoping that my hand might graze yours. Sometimes our fingers came dangerously close before either of us pulled back at the last moment. Even that tiny almost-touch made my heart race.<br><br>

You noticed it too.<br><br>

I could see it in the way your shoulders tensed slightly when I moved closer. In the way your fingers curled softly for a moment before relaxing again. In the way you avoided looking directly at me when our arms brushed just a little too close.<br><br>

Both of us pretending not to notice.<br><br>

Both of us noticing everything.<br><br>

It felt like we had been holding something back for far too long.<br><br>

As we walked further, you slowed slightly and moved towards a car parked in the corner of the street. You leaned back against it casually, your back resting against the metal.<br><br>

I stopped in front of you.<br><br>

For a moment neither of us spoke.<br><br>

You looked into my eyes.<br><br>

There was something in that look — something soft but dangerously inviting. Your gaze held mine just a little longer than normal, your breathing slightly deeper now.<br><br>

My hands instinctively wanted to move towards you.<br><br>

But the street was still too open.<br><br>

Too visible.<br><br>

So instead I walked past you, trying to look normal, signalling you with a small glance to follow.`,



`We continued walking until we reached an apartment building and quietly moved to the back where it was far more secluded. The sounds of the street faded behind us, replaced by a stillness that suddenly made everything feel much more intense.<br><br>

You stepped back against the wall.<br><br>

Again, you looked at me.<br><br>

This time you didn’t look away.<br><br>

Your eyes held mine, softer now. Your breathing slowed, but it was deeper, fuller. Your lips parted just slightly as if you were about to say something — but you didn’t.<br><br>

I walked closer.<br><br>

Slowly.<br><br>

Carefully.<br><br>

The distance between us disappeared step by step until I could feel the warmth of your body through the thin space between us.<br><br>

My hands hovered near you for a moment, trying to stay respectful, unsure where they were allowed to rest.<br><br>

You looked up at me.<br><br>

Your eyes were half closed now, and there was a faint nervous smile on your lips — the kind that appears when someone knows exactly what is about to happen but still pretends they don’t.<br><br>

My heart pounded in my chest.<br><br>

I leaned in slowly.<br><br>

Very gently.<br><br>

Our lips finally met.<br><br>

The kiss was soft, almost careful, as if both of us were savoring the moment we had imagined for so long.`,



`For a moment, the world felt silent.<br><br>

Just you and me.<br><br>

But suddenly, somewhere in the distance, loud voices of kids broke the silence. Their laughter echoed through the alley and shattered the moment instantly.<br><br>

You pulled away.<br><br>

Your eyes widened slightly before you stepped away from the wall, fixing your hoodie as if trying to make everything look normal again.<br><br>

Then you began walking.<br><br>

For a moment I just stood there watching you leave.<br><br>

My heart rate increased instantly.<br><br>

There was no way I could just let you walk away like that. Not after everything that had been building between us — the tension, the hesitation, the quiet longing neither of us had dared to act on.<br><br>

Something inside me suddenly snapped.<br><br>

A rush of adrenaline moved through me before I could even think.<br><br>

I stepped forward, caught your arm, and pulled you back.<br><br>

You turned in surprise, and before either of us could say anything, your back was against the wall again.<br><br>

This time I didn’t leave space between us.<br><br>

My hand rested against the wall beside you, trapping you gently between me and the cold concrete.<br><br>

You looked up at me.<br><br>

Your eyes were wide now, but you didn’t move away.<br><br>

Your hands slowly rose and rested around my neck.<br><br>

I leaned closer.<br><br>

This time the kiss wasn’t hesitant.<br><br>

It was deeper, more certain — as if all the restraint from before had finally broken.<br><br>

Your breathing grew heavier against my cheek.<br><br>

Every second felt dangerously intense.<br><br>

But we couldn’t stay there any longer.<br><br>

Slowly, reluctantly, we pulled away.<br><br>

But both of us knew something had changed.<br><br>

The restraint we had been holding onto for so long had finally cracked.<br><br>

And this was only the beginning of our desires.`

];

let i = 0;

function unlockOne(){
  if(document.getElementById("pass1").value.trim().toLowerCase() === PASSWORD1){
    document.getElementById("firstLock").classList.add("hidden");
    document.getElementById("disclaimer").classList.remove("hidden");
  } else {
    document.getElementById("err1").innerText = "Hint: apple";
  }
}

function unlockTwo(){
  if(document.getElementById("pass2").value.trim().toLowerCase() === PASSWORD2){
    document.getElementById("disclaimer").classList.add("hidden");
    document.getElementById("bookContent").classList.remove("hidden");

    document.querySelector(".book").classList.add("storyMode"); // ADD THIS

    showText();
  } else {
    document.getElementById("err2").innerText = "Only honesty unlocks the next page.";
  }
}


function showText(){
  const textDiv = document.getElementById("text");

  textDiv.innerHTML = pages[i];

  // ✅ RESET SCROLL TO TOP
  textDiv.scrollTop = 0;

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  prevBtn.disabled = (i === 0);

  if(i === pages.length - 1){
    nextBtn.innerText = "Close the Book";
  } else {
    nextBtn.innerText = "Next";
  }
}


function nextPage(){
  if(i < pages.length - 1){
    i++;
    showText();
  } else {
    // Last page → go back to main story
    window.location.href = "index.html";
  }
}

function prevPage(){
  if(i > 0){
    i--;
    showText();
  }
}



</script>

</body>
</html>
